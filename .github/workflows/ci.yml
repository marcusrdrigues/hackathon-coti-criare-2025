name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bdgestao
          POSTGRES_USER: user
          POSTGRES_PASSWORD: coti
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U user -d bdgestao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # histórico completo: o SonarCloud usa o blame para separar código novo
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar e rodar os testes
        run: |
          set -o pipefail
          ./mvnw -B -ntp verify 2>&1 | tee build.log

      - name: Conferir os testes no PostgreSQL (Testcontainers)
        run: |
          # Sem Docker as suítes *Postgres* são puladas em silêncio; no CI isso seria um falso verde
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          total = puladas = 0
          for arquivo in glob.glob('target/surefire-reports/TEST-*Postgres*.xml'):
              suite = ET.parse(arquivo).getroot()
              total += int(suite.get('tests')); puladas += int(suite.get('skipped'))
          rodaram = total - puladas
          print(f'::notice title=PostgreSQL real::{rodaram} de {total} testes rodaram no PostgreSQL (Testcontainers)')
          sys.exit(0 if total and not puladas else 1)
          PY

      - name: Cobertura de testes (JaCoCo)
        run: |
          python3 - <<'PY'
          import csv, os
          linhas = cobertas = ramos = ramos_cobertos = 0
          with open('target/site/jacoco/jacoco.csv') as f:
              for l in csv.DictReader(f):
                  cobertas += int(l['LINE_COVERED'])
                  linhas += int(l['LINE_COVERED']) + int(l['LINE_MISSED'])
                  ramos_cobertos += int(l['BRANCH_COVERED'])
                  ramos += int(l['BRANCH_COVERED']) + int(l['BRANCH_MISSED'])
          pl = 100 * cobertas / linhas; pr = 100 * ramos_cobertos / ramos
          texto = f'Linhas: {pl:.1f}% · Ramos: {pr:.1f}%'
          print(f'::notice title=Cobertura do back-end::{texto}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as resumo:
              resumo.write(f'### Cobertura do back-end (JaCoCo)\n\n{texto}\n')
          PY

      - name: Guardar o relatório de cobertura
        uses: actions/upload-artifact@v6
        with:
          name: cobertura-backend
          path: backend/target/site/jacoco/
          retention-days: 14

      - name: Verificar se o SonarCloud está configurado
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: echo "ativo=$([ -n "$SONAR_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Análise no SonarCloud
        if: steps.sonar.outputs.ativo == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

      - name: Resumo dos erros de build/teste
        if: failure()
        run: |
          # Junta as linhas de erro numa anotação, para ver o motivo direto no resumo do job
          resumo=$(grep -E "^\[ERROR\]|Tests run:.*Fail|expected|Exception" build.log | grep -v "^\[ERROR\] *$" | head -60 || true)
          if [ -n "$resumo" ]; then
            echo "::error title=Build do back-end::$(echo "$resumo" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          fi

      - name: Subir a API com dados de demonstração (PostgreSQL)
        run: |
          nohup java -jar target/Gestao-*.jar --spring.profiles.active=demo > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8085/actuator/health > /dev/null && exit 0
            sleep 2
          done
          echo "::error::A API não subiu em 120 segundos"
          tail -n 80 api.log
          exit 1

      - name: Teste de fumaça da API
        run: ./scripts/smoke-test-api.sh

      - name: Log da API em caso de falha
        if: failure()
        run: tail -n 150 api.log || true

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build de produção
        run: npm run build
      - name: Testes
        run: npm test -- --watch=false

  e2e:
    name: Ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bdgestao
          POSTGRES_USER: user
          POSTGRES_PASSWORD: coti
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U user -d bdgestao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Empacotar a API
        working-directory: backend
        run: ./mvnw -B -ntp -DskipTests package

      - name: Subir a API com dados de demonstração (PostgreSQL)
        working-directory: backend
        run: |
          nohup java -jar target/Gestao-*.jar --spring.profiles.active=demo > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8085/actuator/health > /dev/null && exit 0
            sleep 2
          done
          echo "::error::A API não subiu em 120 segundos"
          tail -n 80 api.log
          exit 1

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci   # o navegador é o Google Chrome do próprio runner (ver playwright.config.ts)

      - name: Testes ponta a ponta
        working-directory: frontend
        run: npm run e2e

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: relatorio-playwright
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

      - name: Log da API em caso de falha
        if: failure()
        working-directory: backend
        run: tail -n 150 api.log || true
