name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bdgestao
          POSTGRES_USER: user
          POSTGRES_PASSWORD: coti
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U user -d bdgestao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar e rodar os testes
        run: ./mvnw -B -ntp verify

      - name: Subir a API com dados de demonstração (PostgreSQL)
        run: |
          nohup java -jar target/Gestao-*.jar --spring.profiles.active=demo > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8085/api-docs > /dev/null && exit 0
            sleep 2
          done
          echo "::error::A API não subiu em 120 segundos"
          tail -n 80 api.log
          exit 1

      - name: Teste de fumaça da API
        run: ./scripts/smoke-test-api.sh

      - name: Log da API em caso de falha
        if: failure()
        run: tail -n 150 api.log || true

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build de produção
        run: npm run build
      - name: Testes
        run: npm test -- --watch=false
