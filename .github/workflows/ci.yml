name: CI

on:
  push:
    branches-ignore: ['dependabot/**']   # as PRs do Dependabot já rodam pelo pull_request
  pull_request:

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bdgestao
          POSTGRES_USER: user
          POSTGRES_PASSWORD: coti
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U user -d bdgestao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # histórico completo: o SonarCloud usa o blame para separar código novo
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar e rodar os testes
        run: |
          set -o pipefail
          ./mvnw -B -ntp verify 2>&1 | tee build.log

      - name: Conferir os testes no PostgreSQL (Testcontainers)
        run: |
          # Sem Docker as suítes *Postgres* são puladas em silêncio; no CI isso seria um falso verde
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          total = puladas = 0
          for arquivo in glob.glob('target/surefire-reports/TEST-*Postgres*.xml'):
              suite = ET.parse(arquivo).getroot()
              total += int(suite.get('tests')); puladas += int(suite.get('skipped'))
          rodaram = total - puladas
          print(f'::notice title=PostgreSQL real::{rodaram} de {total} testes rodaram no PostgreSQL (Testcontainers)')
          sys.exit(0 if total and not puladas else 1)
          PY

      - name: Cobertura de testes (JaCoCo)
        run: |
          python3 - <<'PY'
          import csv, os
          linhas = cobertas = ramos = ramos_cobertos = 0
          classes = []
          with open('target/site/jacoco/jacoco.csv') as f:
              for l in csv.DictReader(f):
                  cobertas += int(l['LINE_COVERED'])
                  linhas += int(l['LINE_COVERED']) + int(l['LINE_MISSED'])
                  ramos_cobertos += int(l['BRANCH_COVERED'])
                  ramos += int(l['BRANCH_COVERED']) + int(l['BRANCH_MISSED'])
                  classes.append((int(l['LINE_MISSED']), f"{l['PACKAGE'].removeprefix('com.gestao.')}.{l['CLASS']}"))
          pl = 100 * cobertas / linhas; pr = 100 * ramos_cobertos / ramos
          texto = f'Linhas: {pl:.1f}% · Ramos: {pr:.1f}%'
          print(f'::notice title=Cobertura do back-end::{texto}')
          # Onde estão as linhas sem teste, para saber por onde começar
          descobertas = sorted((c for c in classes if c[0]), reverse=True)[:12]
          lista = ' · '.join(f'{nome} ({faltam})' for faltam, nome in descobertas)
          print(f'::notice title=Mais linhas sem teste::{lista}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as resumo:
              resumo.write(f'### Cobertura do back-end (JaCoCo)\n\n{texto}\n\nMais linhas sem teste: {lista}\n')
          PY

      - name: Guardar o relatório de cobertura
        uses: actions/upload-artifact@v6
        with:
          name: cobertura-backend
          path: backend/target/site/jacoco/
          retention-days: 14

      - name: Resumo dos erros de build/teste
        if: failure()
        run: |
          # Junta as linhas de erro numa anotação, para ver o motivo direto no resumo do job
          resumo=$(grep -E "^\[ERROR\]|Tests run:.*Fail|expected|Exception" build.log | grep -v "^\[ERROR\] *$" | head -60 || true)
          if [ -n "$resumo" ]; then
            echo "::error title=Build do back-end::$(echo "$resumo" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          fi

      - name: Subir a API com dados de demonstração (PostgreSQL)
        run: |
          nohup java -jar target/Gestao-*.jar --spring.profiles.active=demo > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8085/actuator/health > /dev/null && exit 0
            sleep 2
          done
          echo "::error::A API não subiu em 120 segundos"
          tail -n 80 api.log
          exit 1

      - name: Teste de fumaça da API
        run: ./scripts/smoke-test-api.sh

      - name: Log da API em caso de falha
        if: failure()
        run: tail -n 150 api.log || true

      - name: Verificar se o SonarCloud está configurado
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: echo "ativo=$([ -n "$SONAR_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Por último: um problema no SonarCloud não impede o teste de fumaça de rodar
      - name: Análise no SonarCloud
        if: steps.sonar.outputs.ativo == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: .
        run: |
          # Da raiz, para analisar back-end e front-end juntos (ver sonar-project.properties)
          set -o pipefail
          npx --yes @sonar/scan \
            -Dsonar.java.libraries="$HOME/.m2/repository/**/*.jar" \
            -Dsonar.qualitygate.wait=true 2>&1 | tee sonar.log

      - name: Issues abertas no SonarCloud
        if: always() && steps.sonar.outputs.ativo == 'true'
        working-directory: .
        run: |
          # Lista as issues como anotações no GitHub, com arquivo e linha, para corrigir sem sair do PR
          # O projeto é público: a consulta não precisa de token
          # A busca de issues do SonarCloud é indexada alguns segundos depois do fim da análise
          sleep 45
          # Mesma branch ou PR que acabou de ser analisada (sem isso a busca olha a main)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            alvo="pullRequest=${{ github.event.number }}"
          else
            alvo="branch=${{ github.ref_name }}"
          fi
          url="https://sonarcloud.io/api/issues/search?componentKeys=marcusrdrigues_hackathon-coti-criare-2025&resolved=false&ps=100&$alvo"
          status=$(curl -s -o issues.json -w "%{http_code}" "$url")
          if [ "$status" != "200" ]; then
            echo "::warning title=SonarCloud::Não consegui listar as issues (HTTP $status): $(head -c 300 issues.json)"
            exit 0
          fi
          # Linhas de código por linguagem, para conferir que back-end e front-end entraram na análise
          curl -s -o linguagens.json "https://sonarcloud.io/api/measures/component?component=marcusrdrigues_hackathon-coti-criare-2025&metricKeys=ncloc_language_distribution&$alvo" || true
          python3 - <<'PY'
          import json
          dados = json.load(open('issues.json'))
          print(f"::notice title=SonarCloud::{dados['total']} issue(s) aberta(s)")
          for i in dados['issues']:
              caminho = i['component'].split(':', 1)[-1]
              linha = i.get('line', 1)
              texto = f"{i['message']} ({i['rule']}, {i.get('severity', '')})".replace('%', '%25')
              print(f"::warning file={caminho},line={linha},title=SonarCloud::{texto}")
          try:
              medidas = json.load(open('linguagens.json'))['component']['measures']
              print(f"::notice title=SonarCloud (linhas por linguagem)::{medidas[0]['value']}")
          except Exception:
              pass
          PY

      - name: Motivo da falha no SonarCloud
        if: failure() && steps.sonar.outputs.ativo == 'true'
        working-directory: .
        run: |
          motivo=$(grep -E "ERROR" sonar.log | head -15 || true)
          [ -n "$motivo" ] && echo "::error title=SonarCloud::$(echo "$motivo" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')" || true
          # Quais condições do quality gate reprovaram (ex.: cobertura do código novo)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            alvo="pullRequest=${{ github.event.number }}"
          else
            alvo="branch=${{ github.ref_name }}"
          fi
          curl -s -o gate.json "https://sonarcloud.io/api/qualitygates/project_status?projectKey=marcusrdrigues_hackathon-coti-criare-2025&$alvo" || exit 0
          python3 - <<'PY'
          import json
          try:
              condicoes = json.load(open('gate.json'))['projectStatus']['conditions']
          except Exception:
              raise SystemExit(0)
          for c in condicoes:
              if c.get('status') == 'ERROR':
                  print(f"::error title=Quality gate::{c['metricKey']} = {c.get('actualValue')} (limite {c.get('comparator')} {c.get('errorThreshold')})")
          PY

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build de produção
        run: npm run build
      - name: Testes
        run: npm test -- --watch=false

  e2e:
    name: Ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bdgestao
          POSTGRES_USER: user
          POSTGRES_PASSWORD: coti
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U user -d bdgestao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Empacotar a API
        working-directory: backend
        run: ./mvnw -B -ntp -DskipTests package

      - name: Subir a API com dados de demonstração (PostgreSQL)
        working-directory: backend
        run: |
          nohup java -jar target/Gestao-*.jar --spring.profiles.active=demo > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8085/actuator/health > /dev/null && exit 0
            sleep 2
          done
          echo "::error::A API não subiu em 120 segundos"
          tail -n 80 api.log
          exit 1

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci   # o navegador é o Google Chrome do próprio runner (ver playwright.config.ts)

      - name: Testes ponta a ponta
        working-directory: frontend
        run: npm run e2e

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: relatorio-playwright
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

      - name: Log da API em caso de falha
        if: failure()
        working-directory: backend
        run: tail -n 150 api.log || true
