# Atualizações automáticas de dependências.
# Uma PR por ecossistema por semana (as atualizações menores vêm agrupadas),
# para o histórico não virar uma fila de PRs. Toda PR passa pelo CI.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(backend)"
    groups:
      backend-menores:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(frontend)"
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "@schematics/angular"]
      frontend-menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    commit-message:
      prefix: "build(docker)"
