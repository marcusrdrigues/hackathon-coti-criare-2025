# Testes rodam num H2 em memória, sem depender do PostgreSQL
spring.datasource.url=jdbc:h2:mem:gestao-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Testes usam as mesmas migrações do Flyway que a produção
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Histórico de alterações com o Hibernate Envers (spec 003, R1; docs/adr/0021). As tabelas
# nascem na migração V6; a exclusão guarda o último estado do registro.
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.org.hibernate.envers.revision_field_name=revisao_id
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=tipo_revisao
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true
app.cors.allowed-origins=http://localhost:4200
app.jwt.secret=
app.jwt.issuer=portal-criare
app.jwt.expiracao-acesso=15m
app.jwt.expiracao-refresh=7d
app.jwt.cookie-seguro=false
springdoc.api-docs.path=/api-docs
management.endpoints.web.exposure.include=health
app.demo.reset-cron=-
# Mesmo formato de log da aplicação: o traceId entre colchetes em cada linha
logging.pattern.correlation=[%X{traceId:-}]\u0020
management.otlp.metrics.export.enabled=false
# Superadmin dos testes (a senha só existe aqui)
app.superadmin.email=admin@plataforma.com
app.superadmin.senha=senhaDoSuperadmin123
