# Segredos locais num arquivo .env (fora do git; modelo em .env.example). Variáveis de ambiente de
# verdade, como as do Render, têm prioridade sobre ele. Sem o arquivo, nada muda.
spring.config.import=optional:file:.env[.properties]

# SERVER_PORT tem prioridade; PORT é a variável que plataformas como o Render definem
server.port=${SERVER_PORT:${PORT:8085}}
server.servlet.context-path=/

# Banco de dados (os valores padrão batem com o docker-compose.yml)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/bdgestao}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:coti}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# O esquema é criado e alterado pelas migrações do Flyway (src/main/resources/db/migration).
# O Hibernate só confere se as entidades batem com o banco e não altera nada.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
# Banco que já existia antes do Flyway (criado pelo Hibernate): marca como versão 1 e segue dali
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# As migrações pendentes rodam numa transação só: ou entram todas, ou nenhuma
spring.flyway.group=true
# Uma migração que espera um bloqueio (por exemplo, da versão anterior ainda no ar durante
# o deploy) desiste em 30 segundos com erro no log, em vez de travar a subida sem aviso.
# O PostgreSQL desfaz a migração inteira e o deploy falha, mantendo a versão anterior.
spring.flyway.init-sqls=SET lock_timeout = '30s'
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Histórico de alterações com o Hibernate Envers (spec 003, R1; docs/adr/0021). As tabelas
# nascem na migração V6; a exclusão guarda o último estado do registro.
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.org.hibernate.envers.revision_field_name=revisao_id
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=tipo_revisao
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true

# Origens do front-end liberadas no CORS (separadas por vírgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# Autenticação JWT
# JWT_SECRET: chave em Base64 com pelo menos 256 bits (ex.: openssl rand -base64 32).
# Sem ela, a API gera uma chave aleatória a cada inicialização.
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=portal-criare
app.jwt.expiracao-acesso=${JWT_EXPIRACAO_ACESSO:15m}
app.jwt.expiracao-refresh=${JWT_EXPIRACAO_REFRESH:7d}
# true em produção (HTTPS): o cookie do refresh token só trafega por conexão segura
app.jwt.cookie-seguro=${JWT_COOKIE_SECURE:false}

# Superadmin da plataforma (spec 001, R3): só existe se as duas variáveis estiverem definidas.
# A senha precisa de pelo menos 12 caracteres. Sem elas, nenhum superadmin fica ativo.
app.superadmin.email=${SUPERADMIN_EMAIL:}
app.superadmin.senha=${SUPERADMIN_SENHA:}

# Endereço do front-end, usado nos links enviados por e-mail (redefinição de senha)
app.url-frontend=${APP_URL_FRONTEND:http://localhost:4200}

# Envio de e-mail pela API da Brevo (spec 004). Sem a chave e o remetente, o envio fica desligado
# e o log avisa. O remetente precisa estar verificado na Brevo.
app.email.brevo.chave=${BREVO_API_KEY:}
app.email.remetente=${EMAIL_REMETENTE:}
app.email.remetente-nome=${EMAIL_REMETENTE_NOME:Portal Criare}
# Domínios cujas contas não recebem o link de redefinição (os e-mails de exemplo da demo não existem)
app.redefinicao.dominios-sem-envio=${REDEFINICAO_DOMINIOS_SEM_ENVIO:demo.com}

# Health check (usado pelo Render e por orquestradores): só o status, sem detalhes
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Rastreio (ver docs/adr/0014): cada requisição ganha um traceId, que aparece em todo log dela
# e volta no cabeçalho X-Trace-Id e nas respostas de erro. Traces só são exportados se
# management.opentelemetry.tracing.export.otlp.endpoint for configurado.
logging.pattern.correlation=[%X{traceId:-}]\u0020
management.otlp.metrics.export.enabled=false
# Logs em JSON (formato ECS) em produção: LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs

# Profile demo: horário em que os dados de exemplo voltam ao estado inicial (horário de Brasília)
app.demo.reset-cron=${DEMO_RESET_CRON:0 0 4 * * *}
