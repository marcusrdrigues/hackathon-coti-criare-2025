server.port=${SERVER_PORT:8085}
server.servlet.context-path=/

# Banco de dados (os valores padrão batem com o docker-compose.yml)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/bdgestao}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:coti}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true

# Origens do front-end liberadas no CORS (separadas por vírgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# Autenticação JWT
# JWT_SECRET: chave em Base64 com pelo menos 256 bits (ex.: openssl rand -base64 32).
# Sem ela, a API gera uma chave aleatória a cada inicialização.
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=portal-criare
app.jwt.expiracao-acesso=${JWT_EXPIRACAO_ACESSO:15m}
app.jwt.expiracao-refresh=${JWT_EXPIRACAO_REFRESH:7d}
# true em produção (HTTPS): o cookie do refresh token só trafega por conexão segura
app.jwt.cookie-seguro=${JWT_COOKIE_SECURE:false}
