# Blueprint do Render: cria a API a partir do Dockerfile do back-end.
# O banco fica no Neon (PostgreSQL gratuito) e o front-end na Vercel.
# Passo a passo completo em docs/deploy.md.
services:
  - type: web
    name: portal-criare-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    # Só refaz o deploy quando algo do back-end mudar
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: SPRING_DATASOURCE_URL
        sync: false # ex.: jdbc:postgresql://ep-xxxx.us-east-1.aws.neon.tech/neondb?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false # endereço do front-end na Vercel, ex.: https://portal-criare.vercel.app
      - key: JWT_SECRET
        generateValue: true # 256 bits aleatórios em Base64, gerados pelo Render
      - key: JWT_COOKIE_SECURE
        value: "true"
      - key: DB_POOL_SIZE
        value: "5"
