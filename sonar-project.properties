# Análise do SonarCloud para o monorepo inteiro (back-end Java + front-end TypeScript).
# Roda no CI pelo @sonar/scan, a partir da raiz, depois do ./mvnw verify.
sonar.organization=marcusrdrigues
sonar.projectKey=marcusrdrigues_hackathon-coti-criare-2025
sonar.projectName=Portal Criare
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src,frontend/e2e
sonar.test.inclusions=backend/src/test/java/**,frontend/src/**/*.spec.ts,frontend/e2e/**
sonar.exclusions=frontend/src/**/*.spec.ts

# Java: classes compiladas pelo verify (as bibliotecas vêm do CI, pelo repositório local do Maven)
sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes

# Cobertura: a do back-end vem do JaCoCo. O front-end é coberto pelos testes ponta a ponta
# (Playwright), que não geram relatório de linhas, então fica fora da conta.
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.coverage.exclusions=frontend/**,backend/src/main/java/com/gestao/dtos/**,backend/src/main/java/com/gestao/GestaoApplication.java
