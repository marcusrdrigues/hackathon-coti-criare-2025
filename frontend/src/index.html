<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Portal Criare | Cotações</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#8f0b11">
  <meta name="color-scheme" content="light dark">

  <!-- Aplica o tema antes de desenhar a página (evita piscar claro no modo escuro).
       Mesma regra do TemaService: preferência salva, senão a do sistema. -->
  <script>
    (function () {
      var salva = null;
      try { salva = localStorage.getItem('tema'); } catch (e) {}
      var escuro = salva === 'escuro' ||
        (salva !== 'claro' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-bs-theme', escuro ? 'dark' : 'light');
    })();
  </script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  
</head>
<body>
  <app-root></app-root>
</body>
</html>
