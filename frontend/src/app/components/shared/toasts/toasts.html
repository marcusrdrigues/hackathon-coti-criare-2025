<div class="avisos" aria-live="polite" aria-atomic="false">
  @for (n of notificacao.notificacoes(); track n.id) {
    <div class="aviso" [attr.data-tipo]="n.tipo" [attr.role]="n.tipo === 'erro' ? 'alert' : 'status'">
      <ui-icone class="aviso-icone" [nome]="icones[n.tipo]" [tamanho]="18" />
      <span class="aviso-texto">{{ n.texto }}</span>
      <button type="button" class="aviso-fechar" aria-label="Fechar aviso" (click)="notificacao.fechar(n.id)">
        <ui-icone nome="fechar" [tamanho]="14" />
      </button>
    </div>
  }
</div>
