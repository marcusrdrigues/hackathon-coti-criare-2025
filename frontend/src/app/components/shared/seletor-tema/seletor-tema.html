<fieldset class="seletor">
  <legend class="visually-hidden">Aparência</legend>
  @for (opcao of opcoes; track opcao.valor) {
    <input class="seletor-entrada" type="radio" [name]="nome" [id]="nome + '-' + opcao.valor"
           [value]="opcao.valor" [checked]="tema.preferencia() === opcao.valor"
           (change)="tema.definir(opcao.valor)">
    <label class="seletor-opcao" [for]="nome + '-' + opcao.valor" [title]="opcao.rotulo">
      <i class="bi" [class]="opcao.icone" aria-hidden="true"></i>
      <span class="visually-hidden">{{ opcao.rotulo }}</span>
    </label>
  }
</fieldset>
