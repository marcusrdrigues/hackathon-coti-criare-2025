<div class="login-container">
  <div class="glass-card cadastro-card fade-in">

    <h2 class="text-primary fw-bold mb-1">Crie sua conta</h2>
    <p class="text-muted small mb-4">Junte-se ao nosso ecossistema</p>

    <div class="btn-group w-100 mb-4 shadow-sm" role="group" aria-label="Tipo de conta">
      <button type="button" class="btn" [class.btn-selecionado]="registro.tipo === 'EMPRESA'"
              [class.btn-light]="registro.tipo !== 'EMPRESA'" (click)="setTipo('EMPRESA')">
        <i class="bi bi-building me-1"></i>Sou Empresa
      </button>
      <button type="button" class="btn" [class.btn-selecionado]="registro.tipo === 'FORNECEDOR'"
              [class.btn-light]="registro.tipo !== 'FORNECEDOR'" (click)="setTipo('FORNECEDOR')">
        <i class="bi bi-truck me-1"></i>Sou Fornecedor
      </button>
    </div>

    <p class="small text-muted text-start mb-3">
      @if (registro.tipo === 'EMPRESA') {
        Publique cotações e receba propostas de fornecedores.
      } @else {
        Encontre cotações abertas e envie suas propostas.
      }
    </p>

    @if (erro(); as mensagem) {
      <div class="alert alert-danger py-2 small text-start" role="alert">
        <i class="bi bi-exclamation-circle me-1"></i>{{ mensagem }}
      </div>
    }

    <form (ngSubmit)="cadastrar()">
      <div class="text-start mb-3">
        <label for="nome" class="form-label small fw-bold text-secondary ps-1">
          {{ registro.tipo === 'EMPRESA' ? 'Razão social' : 'Nome / Razão social' }}
        </label>
        <input id="nome" type="text" class="form-control" [(ngModel)]="registro.nome" name="nome"
               placeholder="Ex: Tech Soluções Ltda" maxlength="150" required>
      </div>

      <div class="text-start mb-3">
        <label for="cnpj" class="form-label small fw-bold text-secondary ps-1">CNPJ</label>
        <input id="cnpj" type="text" inputmode="numeric" class="form-control" [ngModel]="registro.cnpj"
               (ngModelChange)="aoDigitarCnpj($event)" name="cnpj" placeholder="00.000.000/0000-00"
               maxlength="18" required>
      </div>

      <div class="text-start mb-3">
        <label for="email" class="form-label small fw-bold text-secondary ps-1">E-mail corporativo</label>
        <input id="email" type="email" class="form-control" [(ngModel)]="registro.email" name="email"
               placeholder="contato@empresa.com" autocomplete="email" maxlength="100" required>
      </div>

      <div class="text-start mb-4">
        <label for="senha" class="form-label small fw-bold text-secondary ps-1">Crie uma senha</label>
        <input id="senha" type="password" class="form-control" [(ngModel)]="registro.senha" name="senha"
               placeholder="Mínimo de 6 caracteres" autocomplete="new-password" minlength="6" maxlength="72" required>
      </div>

      <button type="submit" class="btn btn-criare shadow-sm mb-3" [disabled]="carregando()">
        @if (carregando()) {
          <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>CADASTRANDO...
        } @else {
          CADASTRAR
        }
      </button>
    </form>

    <div class="mt-3 border-top pt-3">
      <small class="text-muted">Já possui cadastro?</small>
      <a routerLink="/pages/login" class="login-link ms-1">Faça login</a>
    </div>
  </div>
</div>
