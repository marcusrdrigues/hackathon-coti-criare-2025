<div class="login-container">
  
  <div class="glass-card fade-in">
    
    <h2 class="text-danger fw-bold mb-1">Crie sua Conta</h2>
    <p class="text-muted small mb-4">Junte-se ao nosso ecossistema</p>

    <div class="btn-group w-100 mb-4 shadow-sm" role="group">
      <button type="button" 
              class="btn" 
              [class.btn-danger]="registro.tipo === 'EMPRESA'"
              [class.btn-light]="registro.tipo !== 'EMPRESA'"
              (click)="setTipo('EMPRESA')">
        Sou Empresa
      </button>
      <button type="button" 
              class="btn" 
              [class.btn-danger]="registro.tipo === 'FORNECEDOR'"
              [class.btn-light]="registro.tipo !== 'FORNECEDOR'"
              (click)="setTipo('FORNECEDOR')">
        Sou Fornecedor
      </button>
    </div>

    <form (ngSubmit)="cadastrar()">
      
      <div class="text-start mb-3">
        <label class="form-label small fw-bold text-secondary ps-1">Razão Social / Nome</label>
        <input 
          type="text" 
          class="form-control" 
          [(ngModel)]="registro.nome" 
          name="nome"
          placeholder="Ex: Tech Soluções Ltda" 
          required>
      </div>

      <div class="text-start mb-3">
        <label class="form-label small fw-bold text-secondary ps-1">CNPJ</label>
        <input 
          type="text" 
          class="form-control" 
          [(ngModel)]="registro.cnpj" 
          name="cnpj"
          placeholder="00.000.000/0000-00" 
          required>
      </div>

      <div class="text-start mb-3">
        <label class="form-label small fw-bold text-secondary ps-1">Email Corporativo</label>
        <input 
          type="email" 
          class="form-control" 
          [(ngModel)]="registro.email" 
          name="email"
          placeholder="contato@empresa.com" 
          required>
      </div>

      <div class="text-start mb-4">
        <label class="form-label small fw-bold text-secondary ps-1">Crie uma Senha</label>
        <input 
          type="password" 
          class="form-control" 
          [(ngModel)]="registro.senha" 
          name="senha"
          placeholder="••••••••" 
          required>
      </div>

      <button type="submit" class="btn btn-criare shadow-sm mb-3">
        CADASTRAR
      </button>

    </form>
    
    <div class="mt-3 border-top pt-3">
      <small class="text-muted">Já possui cadastro?</small>
      <a routerLink="/pages/login" class="login-link ms-1">Faça Login</a>
    </div>

  </div>
</div>
