<main class="pagina">
  <div class="conteudo">
    <img class="logo" src="logo-criare.svg" alt="Criare" width="40" height="40">
    <p class="codigo">Erro 404</p>
    <h1 class="titulo">Página não encontrada</h1>
    <p class="texto">O endereço que você tentou acessar não existe ou foi movido.</p>
    <a class="botao botao-primario" [routerLink]="auth.rotaInicial()">
      {{ auth.logado() ? 'Voltar para o painel' : 'Ir para o login' }}
    </a>
  </div>
</main>
