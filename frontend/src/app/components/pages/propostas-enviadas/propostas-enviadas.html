<app-navbar></app-navbar>

<div class="container mt-4">
    <h2 class="fw-bold text-dark mb-4">Minhas Propostas Enviadas</h2>

    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-4">Solicitação</th>
                        <th>Empresa</th>
                        <th>Meu Lance</th>
                        <th>Status Atual</th>
                        <th class="text-end pe-4">Ação</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of enviadas">
                        <td class="ps-4 fw-bold">{{ item.titulo }}</td>
                        <td>{{ item.empresa }}</td>
                        <td class="fw-bold text-secondary">{{ item.valor }}</td>
                        <td>
                            <span class="badge rounded-pill" 
                                  [ngClass]="item.status === 'EM_NEGOCIACAO' ? 'bg-warning text-dark' : 'bg-info text-dark'">
                                {{ item.statusTexto }}
                            </span>
                        </td>
                        <td class="text-end pe-4">
                            <button class="btn btn-sm btn-outline-danger" 
                                     *ngIf="item.status === 'EM_NEGOCIACAO'"
                                     (click)="abrirNegociacao()">
                                <i class="bi bi-chat-dots me-1"></i> Negociar
                             </button>
                             <span class="text-muted small" *ngIf="item.status !== 'EM_NEGOCIACAO'">Aguardando...</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
