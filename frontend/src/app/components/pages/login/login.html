<div class="login-container">
  
  <div class="glass-card fade-in">
    
    <div class="mb-4">
      <h2 class="text-danger fw-bold tracking-wide">CRIARE</h2>
       <p class="text-muted small">CONSULTING</p>
    </div>

    <h4 class="mb-1 text-dark fw-bold">Bem-vindo</h4>
    <p class="text-muted mb-4 small">Acesse o Portal</p>

    <form (ngSubmit)="fazerLogin()">
      
      <div class="text-start mb-3">
        <label class="form-label small fw-bold text-secondary ps-1">Email Corporativo</label>
        <input 
          type="email" 
          class="form-control" 
          [(ngModel)]="credenciais.email" 
          name="email"
          placeholder="seu@email.com" 
          required>
      </div>

      <div class="text-start mb-3">
        <label class="form-label small fw-bold text-secondary ps-1">Senha</label>
        <input 
          type="password" 
          class="form-control" 
          [(ngModel)]="credenciais.senha" 
          name="senha"
          placeholder="••••••••" 
          required>
      </div>

      <div class="d-flex justify-content-end mb-4">
        <a href="#" class="login-link small">Esqueceu a senha?</a>
      </div>

      <button type="submit" class="btn btn-criare shadow-sm mb-3">
        ENTRAR
      </button>

    </form>
    
    <div class="mt-4 border-top pt-3">
      <small class="text-muted">Ainda não tem conta?</small>
      <a routerLink="/pages/cadastro" class="login-link ms-1">Cadastre-se aqui</a>
    </div>

  </div>
</div>
