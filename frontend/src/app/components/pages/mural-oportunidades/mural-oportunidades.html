<app-navbar></app-navbar>

<div class="container mt-4 mb-5">
  
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="fw-bold text-dark mb-0">Mural de Oportunidades</h2>
        <p class="text-muted small">Encontre novos clientes e envie suas propostas.</p>
    </div>
    <div class="d-none d-md-block" style="width: 300px;">
        <div class="input-group">
            <input type="text" class="form-control" placeholder="Buscar serviços...">
            <button class="btn btn-outline-secondary"><i class="bi bi-search"></i></button>
        </div>
    </div>
  </div>

  <div class="row">
    <div class="col-12 mb-3" *ngFor="let item of oportunidades">
      
      <div class="card shadow-sm border-start-primary h-100">
        <div class="card-body">
          <div class="row align-items-center">
            
            <div class="col-md-8">
              <div class="d-flex align-items-center mb-2">
                <span class="badge bg-light text-primary border border-danger me-2">NOVO</span>
                <h5 class="card-title mb-0 fw-bold">{{ item.titulo }}</h5>
              </div>
              <p class="mb-1 text-muted"><i class="bi bi-building me-1"></i> {{ item.empresa }}</p>
              <p class="card-text small text-secondary mb-2">{{ item.descricao }}</p>
              
              <div class="d-flex gap-3 text-muted small mt-3">
                 <span><i class="bi bi-geo-alt me-1"></i> {{ item.local }}</span>
                 <span [class.text-danger]="diasRestantes(item.dataLimite) < 3">
                    <i class="bi bi-clock me-1"></i> Encerra em: {{ item.dataLimite }}
                 </span>
              </div>
            </div>

            <div class="col-md-4 text-md-end mt-3 mt-md-0 border-start-md ps-md-4">
              <div class="mb-3">
                <small class="text-muted d-block">Orçamento Estimado</small>
                <span class="h4 fw-bold text-success">{{ item.orcamentoEstimado }}</span>
              </div>
              
              <button class="btn w-100" 
                      [ngClass]="item.expandido ? 'btn-outline-secondary' : 'btn-primary'"
                      (click)="toggleProposta(item)">
                <i class="bi" [class.bi-x-lg]="item.expandido" [class.bi-send-fill]="!item.expandido"></i> 
                {{ item.expandido ? 'Cancelar' : 'Enviar Proposta' }}
              </button>
            </div>
          </div>

          <div *ngIf="item.expandido" class="mt-4 pt-3 border-top bg-light rounded p-3 animate-fade-in">
              <div class="row align-items-end">
                  <div class="col-md-8">
                      <label class="form-label fw-bold text-dark small">QUAL O VALOR DA SUA PROPOSTA?</label>
                      <div class="input-group">
                          <span class="input-group-text bg-white text-muted">R$</span>
                          <input type="number" 
                                 class="form-control form-control-lg" 
                                 placeholder="0,00" 
                                 [(ngModel)]="item.valorProposta">
                      </div>
                      <div class="form-text">Inclua taxas e impostos no valor final.</div>
                  </div>
                  <div class="col-md-4 mt-3 mt-md-0">
                      <button class="btn btn-success w-100 btn-lg" (click)="confirmarEnvio(item)">
                          <i class="bi bi-check-circle-fill me-2"></i> Confirmar Envio
                      </button>
                  </div>
              </div>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
